<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Round Log</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #4ade80;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 12px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; margin-bottom: 12px; text-align: center; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  input, button, select {
    font-size: 16px; /* prevents zoom on iOS */
    padding: 12px;
    border-radius: 8px;
    border: none;
  }
  input {
    flex: 1;
    background: #0f172a;
    color: var(--text);
    border: 1px solid #334155;
  }
  button {
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button.secondary { background: #334155; color: var(--text); }
  button.danger { background: var(--red); color: white; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    font-size: 0.9rem;
  }
  .stat { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; }
  .stat b { display: block; font-size: 1.2rem; color: var(--accent); }
  .list {
    max-height: 45vh;
    overflow-y: auto;
    font-size: 0.95rem;
  }
  .item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #334155;
  }
  .item:last-child { border-bottom: none; }
  .multi { font-weight: 700; }
  .multi.high { color: var(--green); }
  .multi.low { color: var(--red); }
  .time { color: var(--muted); font-size: 0.85rem; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { flex: 1; min-width: 100px; }
  #fileInput { display: none; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
</style>
</head>
<body>
  <h1>Aviator Round Log</h1>

  <!-- Add new round -->
  <div class="card">
    <div class="row">
      <input type="number" id="multiInput" placeholder="e.g. 2.45" step="0.01" min="1" inputmode="decimal">
      <button onclick="addRound()">Add</button>
    </div>
    <div class="actions">
      <button class="secondary" onclick="document.getElementById('fileInput').click()">Import CSV</button>
      <button class="secondary" onclick="exportCSV()">Export CSV</button>
      <button class="danger" onclick="clearAll()">Clear</button>
    </div>
    <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)">
  </div>

  <!-- Stats -->
  <div class="card">
    <div class="stats" id="stats">
      <div class="stat"><b id="total">0</b>Rounds</div>
      <div class="stat"><b id="avg">–</b>Average</div>
      <div class="stat"><b id="last10">–</b>Last 10 avg</div>
      <div class="stat"><b id="max">–</b>Highest</div>
    </div>
  </div>

  <!-- History -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
      <strong>History</strong>
      <span id="count" class="time">0 rounds</span>
    </div>
    <div class="list" id="list">
      <div class="empty">No rounds yet. Type a multiplier and tap Add.</div>
    </div>
  </div>

<script>
const STORAGE_KEY = 'aviator_rounds_v1';

function load() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function save(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function addRound() {
  const input = document.getElementById('multiInput');
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 1) {
    alert('Enter a valid multiplier (e.g. 1.87)');
    return;
  }
  const rounds = load();
  rounds.unshift({
    multi: Math.round(val * 100) / 100,
    time: new Date().toISOString()
  });
  save(rounds);
  input.value = '';
  input.focus();
  render();
}

function clearAll() {
  if (confirm('Delete all rounds on this phone?')) {
    localStorage.removeItem(STORAGE_KEY);
    render();
  }
}

function render() {
  const rounds = load();
  const list = document.getElementById('list');
  const total = rounds.length;

  document.getElementById('total').textContent = total;
  document.getElementById('count').textContent = total + ' rounds';

  if (total === 0) {
    list.innerHTML = '<div class="empty">No rounds yet. Type a multiplier and tap Add.</div>';
    document.getElementById('avg').textContent = '–';
    document.getElementById('last10').textContent = '–';
    document.getElementById('max').textContent = '–';
    return;
  }

  // Stats
  const sum = rounds.reduce((a, r) => a + r.multi, 0);
  const avg = (sum / total).toFixed(2);
  const last10 = rounds.slice(0, 10);
  const last10avg = (last10.reduce((a, r) => a + r.multi, 0) / last10.length).toFixed(2);
  const max = Math.max(...rounds.map(r => r.multi)).toFixed(2);

  document.getElementById('avg').textContent = avg + 'x';
  document.getElementById('last10').textContent = last10avg + 'x';
  document.getElementById('max').textContent = max + 'x';

  // List
  list.innerHTML = rounds.map(r => {
    const cls = r.multi >= 10 ? 'high' : r.multi < 2 ? 'low' : '';
    const time = new Date(r.time).toLocaleString([], {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short'});
    return `<div class="item">
      <span class="multi ${cls}">${r.multi.toFixed(2)}x</span>
      <span class="time">${time}</span>
    </div>`;
  }).join('');
}

function exportCSV() {
  const rounds = load();
  if (rounds.length === 0) {
    alert('Nothing to export');
    return;
  }
  let csv = 'multiplier,timestamp\n';
  rounds.forEach(r => {
    csv += `${r.multi},${r.time}\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'aviator_rounds.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const text = ev.target.result;
    const lines = text.trim().split('\n');
    const rounds = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line || line.toLowerCase().startsWith('multiplier')) continue;
      const parts = line.split(',');
      const multi = parseFloat(parts[0]);
      if (isNaN(multi)) continue;
      const time = parts[1] ? parts[1].trim() : new Date().toISOString();
      rounds.push({ multi, time });
    }
    if (rounds.length === 0) {
      alert('No valid rounds found in the file');
      return;
    }
    // Keep newest first
    rounds.sort((a, b) => new Date(b.time) - new Date(a.time));
    if (confirm(`Import ${rounds.length} rounds? This will replace the current log.`)) {
      save(rounds);
      render();
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // reset
}

// Enter key support
document.getElementById('multiInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addRound();
});

render();
</script>
</body>
</html>
